# yaml-language-server: $schema=../../node_modules/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Tingeworks/visitdhakaorg
  branch: main

# Edits are saved as pull requests and go live only when merged into main.
publish_mode: editorial_workflow

# Enables editing local files through the File System Access API when running `astro dev`.
# Open http://localhost:4321/admin/ in Chrome or Edge and choose "Work with Local Repository".
local_backend: true

# Browser tab title and welcome text. The heading on the loading screen is hidden in src/pages/admin/index.astro.
app_title: tingeworks
logo:
  src: /admin/tingeworks-logo.svg

site_url: https://visitdhaka.org
display_url: https://visitdhaka.org

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: overview
    label: Overview
    label_singular: Overview page
    folder: src/content/docs/overview
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string }
      - name: description
        label: Description
        widget: text
        hint: One or two sentences. Used in search results and link previews.
      - name: tags
        label: Tags
        widget: list
        required: false
        default: []
      - name: sidebar
        label: Sidebar
        widget: object
        required: false
        collapsed: true
        hint: Only needed for section index pages, to set the sidebar label and order.
        fields:
          - { name: label, label: Label, widget: string, required: false }
          - { name: order, label: Order, widget: number, value_type: int, required: false }
      - name: verified
        label: Fact-checked by an editor
        widget: boolean
        default: false
        hint: Tick only after checking every fact against an official or first-hand source.
      - { name: body, label: Body, widget: markdown }

